<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 网脉 NetPulse 网络监控</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff5a1f'/%3E%3Cpolyline points='4,18 11,18 14,10 18,25 21,14 23,18 28,18' fill='none' stroke='white' stroke-width='2.6'/%3E%3C/svg%3E">
<style>
  /* 登录页不需要登录即可访问，样式全部内联，不依赖 style.css */
  :root { --paper: #f3efe6; --panel: #faf8f3; --ink: #1a1a1a; --ink-2: #4a4740; --ink-3: #8a857a; --line: #cfc8b8; --accent: #ff5a1f; --down: #d63a22;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
    --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 13px/1.5 var(--sans); }
  body { display: grid; place-items: center; min-height: 100vh; padding: 16px;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px; background-position: -1px -1px; }
  .box { width: 100%; max-width: 360px; background: var(--panel); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  .head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .logo { width: 32px; height: 32px; border: 2px solid var(--ink); display: grid; place-items: center; flex: none; }
  h1 { margin: 0; font-size: 19px; line-height: 1.15; letter-spacing: .5px; }
  h1 .slash { color: var(--accent); margin: 0 4px; }
  .sub { color: var(--ink-3); font-size: 11px; }
  form { padding: 18px; }
  label { display: block; margin-bottom: 12px; }
  label span { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 3px; }
  input { width: 100%; font: 15px var(--mono); padding: 8px 10px; border: 1px solid var(--ink); background: #fff; color: var(--ink); border-radius: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { width: 100%; padding: 9px; font: 600 14px var(--sans); background: var(--ink); color: #fff; border: 1px solid var(--ink); cursor: pointer; }
  button:hover { background: #333; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { min-height: 20px; margin: 10px 0 0; font-size: 12px; color: var(--down); }
  .help { font-size: 12px; color: var(--ink-3); margin: 0 0 14px; }
  .help b { color: var(--ink-2); }
  code { font: 12px var(--mono); background: #ebe6da; padding: 0 4px; }
  .foot { border-top: 1px solid var(--line); padding: 8px 18px; font: 11px var(--mono); color: var(--ink-3); display: flex; justify-content: space-between; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="box">
  <div class="head">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="2" y="3" width="18" height="3" fill="#1a1a1a"/><rect x="9" y="6" width="4" height="10" fill="#1a1a1a"/><rect x="4" y="16" width="14" height="2" fill="#ff5a1f"/></svg></div>
    <div><h1>网脉 NetPulse<span class="slash">/</span><span id="title">登录</span></h1><div class="sub">网络监控 · 管理页面</div></div>
  </div>

  <form id="login" class="hidden">
    <label><span>密码</span><input type="password" id="pw" autocomplete="current-password" autofocus required></label>
    <button type="submit">登录</button>
    <div class="msg" id="loginMsg"></div>
  </form>

  <form id="setup" class="hidden">
    <p class="help">第一次使用，请先设置<b>管理密码</b>。之后打开这个页面都需要输入密码，登录后这个浏览器 <span class="ttl">30</span> 天内不用再输。</p>
    <label><span>新密码（至少 6 位）</span><input type="password" id="np1" autocomplete="new-password" minlength="6" required></label>
    <label><span>再输一次</span><input type="password" id="np2" autocomplete="new-password" minlength="6" required></label>
    <button type="submit">设置密码并进入</button>
    <div class="msg" id="setupMsg"></div>
  </form>

  <div id="remote" class="hidden" style="padding:18px">
    <p class="help" style="margin:0">还没有设置管理密码。为安全起见，第一次设置只能在<b>运行 网脉 NetPulse 的那台电脑</b>上操作：在那台电脑上打开 <code>http://127.0.0.1:<span id="port"></span>/</code> 设置密码后，再回到这里登录。</p>
  </div>

  <div class="foot"><span id="ver"></span><span id="ttlNote"></span></div>
</div>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  // 登录后回到原来的页面（保留 #/mcp 这类页面锚点）
  const back = () => location.replace('/' + (location.hash || ''));

  async function post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    let d = {};
    try { d = await r.json(); } catch (e) { /* 非 JSON */ }
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    return d;
  }

  async function init() {
    let st;
    try {
      st = await (await fetch('/api/auth/state', { cache: 'no-store' })).json();
    } catch (e) {
      $('login').classList.remove('hidden');
      $('loginMsg').textContent = '无法连接 网脉 NetPulse 服务：' + e.message;
      return;
    }
    if (st.logged_in) return back();
    $('ver').textContent = st.version ? 'v' + st.version : '';
    document.querySelectorAll('.ttl').forEach(e => { e.textContent = st.ttl_days; });
    $('ttlNote').textContent = `登录后 ${st.ttl_days} 天内免登录`;
    if (st.password_set) {
      $('login').classList.remove('hidden');
      $('pw').focus();
    } else if (st.can_setup) {
      $('title').textContent = '设置密码';
      $('setup').classList.remove('hidden');
      $('np1').focus();
    } else {
      $('title').textContent = '尚未设置密码';
      $('port').textContent = location.port || '80';
      $('remote').classList.remove('hidden');
    }
  }

  $('login').onsubmit = async ev => {
    ev.preventDefault();
    const b = ev.target.querySelector('button');
    b.disabled = true;
    $('loginMsg').textContent = '';
    try {
      await post('/api/auth/login', { password: $('pw').value });
      back();
    } catch (e) {
      $('loginMsg').textContent = e.message;
      $('pw').select();
    } finally { b.disabled = false; }
  };

  $('setup').onsubmit = async ev => {
    ev.preventDefault();
    const p1 = $('np1').value, p2 = $('np2').value;
    if (p1 !== p2) { $('setupMsg').textContent = '两次输入的密码不一致'; return; }
    const b = ev.target.querySelector('button');
    b.disabled = true;
    $('setupMsg').textContent = '';
    try {
      await post('/api/auth/setup', { password: p1 });
      back();
    } catch (e) {
      $('setupMsg').textContent = e.message;
    } finally { b.disabled = false; }
  };

  init();
})();
</script>
</body>
</html>
