name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.20.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: go test -race -count=1 ./... && go vet ./...
      - run: node --test web/charts_test.cjs
      - run: python3 examples/plugins/email-notify/test_main.py
  windows:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.20.14'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sed -nE 's/^var version = "(.*)"/\1/p' main.go)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Generate Windows resources
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64 --product-version "${{ steps.ver.outputs.version }}" --file-version "${{ steps.ver.outputs.version }}"
      - run: GO=go VERSION="${{ steps.ver.outputs.version }}" bash build.sh
      - run: cd dist && cp ../LICENSE ../README.md . && zip -r NetPulse-windows-amd64.zip netPing.exe *.md *.json LICENSE
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/NetPulse-windows-amd64.zip
  macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.20.14'
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sed -nE 's/^var version = "(.*)"/\1/p' main.go)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: GO=go VERSION="${{ steps.ver.outputs.version }}" bash build_mac.sh
      - run: |
          rm -rf dist/pkg dist/NetPulse-macOS.zip
          mkdir -p dist/pkg
          ditto dist/mac/netPing.app dist/pkg/netPing.app
          cp LICENSE README.md dist/pkg/
          ditto -c -k dist/pkg dist/NetPulse-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/NetPulse-macOS.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum *.zip > SHA256SUMS
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --repo "$REPO" --draft --verify-tag --generate-notes --title "网脉 NetPulse $TAG"
